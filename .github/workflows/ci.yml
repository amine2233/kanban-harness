name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm --filter website build

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      # The same toolchain mise pins locally (mise.toml), on both platforms.
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.3.3'
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: backend/.build
          key: spm-${{ runner.os }}-${{ hashFiles('backend/Package.resolved') }}
      - run: swift build --build-tests
      - run: swift test
