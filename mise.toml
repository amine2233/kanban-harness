# Toolchain, environment and tasks for the whole repo (web + backend).
# Install mise: https://mise.jdx.dev — then `mise install` and `mise run setup`.

[tools]
node = "24.21.0"
pnpm = "12.4.2"
swift = "6.4.0"

[env]
# Keep dev data out of ~/.config: registry, settings.json and project folders
# created during development live under .local/ (git-ignored).
MVP_DASHBOARD_HOME = "{{config_root}}/.local/dashboard-home"
# Where `dashboard serve` listens; the Vite dev server proxies /api to it.
MVP_DASHBOARD_PORT = "5175"
# Vite dev server port.
MVP_DASHBOARD_WEB_PORT = "5173"
# Interface the servers bind to. 127.0.0.1 = this machine only (the API has
# no authentication). The *:lan tasks use 0.0.0.0 to expose them on the network.
MVP_DASHBOARD_HOST = "127.0.0.1"
# Personal overrides (never committed).
_.file = ".env.local"

# --- Setup -------------------------------------------------------------------

[tasks.setup]
description = "Install web dependencies and resolve Swift packages"
run = ["pnpm install --frozen-lockfile", "swift package resolve"]

# --- Web ---------------------------------------------------------------------

[tasks."web:dev"]
description = "Vite dev server on http://localhost:5173 (proxies /api to the backend)"
run = "pnpm dev"

[tasks."web:dev:lan"]
description = "Vite dev server reachable from other machines on the network (http://<your-ip>:5173)"
run = "pnpm dev --host 0.0.0.0"

[tasks."web:test"]
description = "Run the web unit tests"
run = "pnpm test"

[tasks."web:check"]
description = "Prettier, ESLint and tsc for the web app"
run = ["pnpm format:check", "pnpm lint", "pnpm typecheck"]

[tasks."web:check:fix"]
description = "Like web:check, but Prettier and ESLint rewrite what they can"
run = ["pnpm format", "pnpm --filter mvp-dashboard lint --fix", "pnpm typecheck"]

[tasks."web:build"]
description = "Production build into dist/"
run = "pnpm build"

[tasks.docs]
description = "Documentation site with live reload (http://localhost:3000)"
run = "pnpm --filter website start"

[tasks."docs:build"]
description = "Build the documentation site into website/build/ (fails on broken links)"
run = "pnpm --filter website build"

# --- Backend -----------------------------------------------------------------

[tasks."backend:build"]
description = "Build the Swift package (server + dashboard CLI)"
run = "swift build"

[tasks."backend:test"]
description = "Run the Swift test suites"
run = "swift test"

[tasks."backend:serve"]
description = "Run the API server on $MVP_DASHBOARD_PORT"
run = "swift run dashboard serve --hostname $MVP_DASHBOARD_HOST --port $MVP_DASHBOARD_PORT"

[tasks."backend:release"]
description = "Build an optimized dashboard binary into .build/release/"
run = "swift build -c release"

# --- Whole project -----------------------------------------------------------

[tasks.dev]
description = "Backend + web dev servers together (Ctrl-C stops both; stale servers on the ports are stopped first)"
depends = ["backend:build"]
run = "scripts/dev.sh"

[tasks."dev:lan"]
description = "Like dev, but the web app is reachable from other machines (backend stays on loopback behind the Vite proxy)"
depends = ["backend:build"]
run = "scripts/dev.sh --lan"

[tasks.test]
description = "All tests (web + backend)"
depends = ["web:test", "backend:test"]

[tasks.check]
description = "Everything CI runs: web checks + tests + build, backend tests"
depends = ["web:check", "web:test", "web:build", "backend:test"]

[tasks.serve]
description = "Serve the built web app and the API from one process"
depends = ["web:build", "backend:release"]
run = ".build/release/dashboard serve --hostname $MVP_DASHBOARD_HOST --port $MVP_DASHBOARD_PORT --static-dir web/dist"

[tasks."serve:lan"]
description = "Like serve, but reachable from other machines (http://<your-ip>:$MVP_DASHBOARD_PORT)"
depends = ["web:build", "backend:release"]
run = ".build/release/dashboard serve --hostname 0.0.0.0 --port $MVP_DASHBOARD_PORT --static-dir web/dist"

[tasks.cli]
description = "Run the dashboard CLI, e.g. `mise run cli -- project list`"
run = "swift run -q dashboard"

[tasks.stop]
description = "Stop any dashboard / Vite dev servers left running"
run = """
#!/usr/bin/env bash
pkill -f 'dashboard serve' && echo "stopped dashboard serve" || echo "no dashboard server running"
pkill -f 'vite' && echo "stopped vite" || echo "no vite running"
exit 0
"""

[tasks.doctor]
description = "Check toolchain, build outputs and dev ports"
run = "scripts/doctor.sh"

[tasks.clean]
description = "Remove build outputs (keeps .local dev data)"
run = ["rm -rf web/dist web/coverage .build"]

[tasks."backend:test:linux"]
description = "Run the Swift tests in the swift:6.4.0 Linux container (needs docker/colima)"
run = 'docker run --rm -v "$PWD:/src" -v mvp-dashboard-linux-build:/src/.build-linux -w /src swift:6.4.0-noble swift test --scratch-path /src/.build-linux'
